name: Desktop plug-in
on:
  push:
    branches: [feature/vst3]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: desktop/build/_deps
          key: juce-9.0.3-${{ runner.os }}
      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build desktop/build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir desktop/build -C Release --output-on-failure
      - name: Package macOS plug-in
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop/build/vst3-dmg
          ditto 'desktop/build/SchwungBreakbeat_artefacts/Release/VST3/Schwung Breakbeat.vst3' 'desktop/build/vst3-dmg/Schwung Breakbeat.vst3'
          hdiutil create -ov -format UDZO -fs HFS+ -volname 'Schwung Breakbeat VST3' -srcfolder desktop/build/vst3-dmg desktop/build/Schwung-Breakbeat-macOS.vst3.dmg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: schwung-breakbeat-macOS
          path: desktop/build/Schwung-Breakbeat-macOS.vst3.dmg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: schwung-breakbeat-Windows
          path: desktop/build/SchwungBreakbeat_artefacts/Release/VST3/
